on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        options:
          - "2021"
          - "2024"
        default: "2024"
        required: true

jobs:
  build:
    runs-on: windows-2025

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: BatUtil
        uses: actions/checkout@v7
        with:
          repository: abbodi1406/BatUtil
          path: BatUtil

      - name: Download
        run: script\Download.ps1 -Version ${{ inputs.version }}

      - name: Build
        run: script\Build.ps1

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          files: W10UI_Debug.log
