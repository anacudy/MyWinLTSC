on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        options:
          - "2021"
          - "2024"
        default: "2024"
        required: true

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout Mine
        uses: actions/checkout@v7

      - name: Checkout W10UI
        uses: actions/checkout@v7
        with:
          repository: abbodi1406/BatUtil
          path: BatUtil

      - name: Get UUID
        id: get_uuid
        run: |
          if (${{ inputs.version }} -eq "2021") {
            $keyword = "21H2 19044 amd64"
          }
          elseif (${{ inputs.version }} -eq "2024") {
            $keyword = "24H2 26100 amd64"
          }
          else {
            throw "invalid version: ${{ inputs.version }}"
          }

          $url = "https://api.uupdump.net/listid.php?search=$keyword&sortByDate=1"
          $builds = (Invoke-RestMethod $url).response.builds.PSObject.Properties.Value
          $latest = $builds | Where-Object title -notmatch 'Cumulative' | Select-Object -First 1
          Write-Host -ForegroundColor Green $latest.title
          Write-Host -ForegroundColor Green $latest.uuid

          Add-Content -Path $env:GITHUB_OUTPUT -Value "uuid=$latest.uuid" -Encoding ascii

      - name: Test
        run: |
          Write-Host -ForegroundColor Red ${{ steps.get_uuid.outputs.uuid }}
          Get-ChildItem
