on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        options:
          - "2021"
          - "2024"
        default: "2024"
        required: true

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout Mine
        uses: actions/checkout@v7

      - name: Checkout W10UI
        uses: actions/checkout@v7
        with:
          repository: abbodi1406/BatUtil
          path: BatUtil

      - name: Get UUID
        id: get_uuid
        run: script/Get-UUID.ps1 -Version ${{ inputs.version }}

      - name: Test
        run: |
          Write-Host ${{ steps.get_uuid.outputs.uuid }}
          Get-ChildItem
