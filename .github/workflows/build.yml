on:
  workflow_dispatch:
    inputs:
      ltsc_version:
        type: choice
        options:
          - "2021"
          - "2024"
        default: "2024"
        required: true

jobs:
  build:
    runs-on: windows-2025

    permissions:
      contents: write

    env:
      LTSC_VERSION: ${{ inputs.ltsc_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: BatUtil
        uses: actions/checkout@v7
        with:
          repository: abbodi1406/BatUtil
          path: BatUtil

      - name: Download
        run: script\Download.ps1

      - name: Build
        run: script\Build.ps1

      - name: Customize
        run: script\Customize.ps1

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          files: |
            dism.7z
